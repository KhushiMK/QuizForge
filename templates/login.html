{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h2>
        
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter your username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>
        
        <p style="text-align: center; margin-top: 2rem; color: var(--text-secondary);">
            New to QuizForge? <a href="{{ url_for('register') }}" style="color: var(--accent); font-weight: 600;">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
